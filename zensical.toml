[project]
site_name = "pyafrobarometer"
site_url = "https://muhammadomarmuhdhar.github.io/pyafrobarometer/"
site_description = "Programmatic access to Afrobarometer survey data in Python."
site_author = "pyafrobarometer contributors"
copyright = "&copy; 2026 pyafrobarometer contributors"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/MuhammadOmarMuhdhar/pyafrobarometer"
repo_name = "MuhammadOmarMuhdhar/pyafrobarometer"
edit_uri = "edit/main/docs/"
exclude_docs = "superpowers/"
strict = true
nav = [
  { "Home" = "index.md" },
  { "Tutorial" = [
    "tutorial/index.md",
    "tutorial/concepts.md",
    "tutorial/discover.md",
    "tutorial/load.md",
    "tutorial/clean.md",
    "tutorial/trend.md",
    "tutorial/cite.md",
    "tutorial/next.md",
  ] },
  { "Guide" = [
    "guide/index.md",
    "guide/concepts.md",
    "guide/rounds.md",
    "guide/countries.md",
    "guide/families.md",
    "guide/master-codebook.md",
    "guide/loading.md",
    "guide/selecting-variables.md",
    "guide/dataset.md",
    "guide/value-labels.md",
    "guide/missing-codes.md",
    "guide/weights.md",
    "guide/canonical-variables.md",
    "guide/family-harmonization.md",
    "guide/multi-round.md",
    "guide/sources.md",
    "guide/panels.md",
    "guide/search.md",
    "guide/codebooks.md",
    "guide/caching-and-offline.md",
    "guide/citation-and-provenance.md",
    "guide/data-policy.md",
    "guide/errors.md",
    "guide/next-steps.md",
  ] },
  { "API reference" = [
    "reference/index.md",
    "reference/functions.md",
    "reference/dataset.md",
    "reference/errors.md",
  ] },
  { "Development" = "development.md" },
]

[project.theme]
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.tracking",
  "content.action.edit",
  "content.action.view",
  "toc.follow",
]
