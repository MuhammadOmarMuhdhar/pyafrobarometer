[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyafrobarometer"
version = "0.1.0"
description = "Programmatic access to Afrobarometer survey data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pyafrobarometer contributors" }]
keywords = ["afrobarometer", "survey", "africa", "public-opinion", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas",
    "pyreadstat",
    "requests",
    "platformdirs",
    "beautifulsoup4",
    "PyYAML",
]

[project.optional-dependencies]
search = ["rapidfuzz"]
codebook = ["pypdf"]
docs = ["zensical"]
dev = [
    "pytest",
    "pytest-cov",
    "respx",
    "ruff",
    "mypy",
    "rapidfuzz",
    "pypdf",
    "pandas-stubs",
]

[project.urls]
Repository = "https://github.com/pyafrobarometer/pyafrobarometer"

[tool.hatch.build.targets.wheel]
packages = ["src/pyafrobarometer"]

[tool.pytest.ini_options]
markers = ["network: hits afrobarometer.org"]
addopts = "-m 'not network'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
